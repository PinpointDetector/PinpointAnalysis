[project]
name = "analysis"
version = "0.1.0"
description = ""
authors = [
    {name = "Tobias Böckh",email = "boeckh.tobias@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel (>=6.30.1,<7.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "awkward (>=2.8.9,<3.0.0)",
    "uproot (>=5.6.6,<6.0.0)",
    "hist (>=2.9.0,<3.0.0)",
    "mplhep (>=0.4.1,<0.5.0)",
    "uncertainties (>=3.2.3,<4.0.0)",
    "fastparquet (>=2024.11.0,<2025.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "torch (==2.3.1)",
    "torch-geometric (>=2.6.1,<3.0.0)",
    "awkward-pandas (>=2023.8.0,<2024.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "particle (>=0.26.1,<0.27.0)",
]

[tool.poetry]
packages = [{include = "analysis", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
